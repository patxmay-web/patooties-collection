<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Patooties Collection</title>
    <!-- External CSS Style Link -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Patooties Collection</h1>
        <p class="tagline">Timeless luxury bags, carefully curated for every occasion.</p>
        
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h2 class="contact-title">Get in Touch</h2>
            <p class="contact-subtitle">Have questions or inquiries? Send us a message below.</p>

            <form action="#" method="POST">
                <fieldset>
                    <legend>Your details</legend>

                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" placeholder="Your Full Name" required>
                    </div>

                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" placeholder="Your Email Address" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Subject</label>
                        <select id="subject" name="subject" required>
                            <option value="" disabled selected>Select an option...</option>
                            <option value="inquiry">Ask a Question about an Item</option>
                            <option value="suggest">Suggest a Bag / Brand</option>
                            <option value="correction">Correct Item Details</option>
                            <option value="other">Something Else</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" rows="5" placeholder="How can we help you?" required></textarea>
                    </div>

                    <button type="submit">Send message</button>
                </fieldset>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 Patooties Collection</p>
        <p>Elegance in every detail.</p>
    </footer>

</body>

</html>
